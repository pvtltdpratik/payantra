name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by deploy.yml, so a release is only ever built from a commit that passed everything below.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/payantra
      - run: npm run typecheck
      - run: npm run lint
      # Includes the security suites (src/tests/security.*.test.ts): RBAC sweep of every route, IDOR, JWT forgery,
      # injection payloads, CORS and headers, production-config validation, redaction, shutdown. Runs on PGlite.
      - run: npm test
      # Applies all migrations to an in-memory Postgres and asserts the integrity constraints.
      - run: npm run db:verify
      # Fails when schema.prisma and the migration history disagree (a forgotten `prisma migrate dev`).
      - run: npm run db:drift
      # The compiled artifact, not the TypeScript: boots in production mode, rejects bad config, serves, drains on SIGTERM.
      - run: npm run build
      - run: npm run smoke:boot

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    # No API, no Supabase, no Razorpay is running: the build and the first requests must not need any of them.
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: https://api.ci.example/api/v1
      NEXT_PUBLIC_SUPABASE_URL: https://ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci
      # https => the production Content-Security-Policy is generated, so it gets built and checked here too.
      NEXT_PUBLIC_SITE_URL: https://shop.ci.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Security headers on the production build
        run: |
          npx next start -p 3100 > start.log 2>&1 &
          NEXT_PID=$!
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3100/returns && break; sleep 1; done
          node scripts/check-headers.mjs http://127.0.0.1:3100 --expect-csp || { cat start.log; kill $NEXT_PID; exit 1; }
          kill $NEXT_PID

  dependency-audit:
    # High/critical advisories in PRODUCTION dependencies fail the build unless .github/audit-allowlist.json accepts them
    # (with a reason and an expiry date).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --ignore-scripts
        working-directory: server
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: node .github/scripts/audit-gate.mjs server
      - run: node .github/scripts/audit-gate.mjs client

  e2e:
    # Real API + real storefront build + headless Chrome, with stand-ins for Supabase and Razorpay. Slow (minutes), so it runs
    # on pushes to main, before deploys, on demand, and on pull requests labelled "e2e" — not on every PR push.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
        working-directory: server
      - run: npx prisma generate
        working-directory: server
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/payantra
      - run: npm ci
        working-directory: client
      - run: npm ci || npm install
        working-directory: e2e
      # google-chrome is preinstalled on ubuntu-latest; BROWSER_PATH overrides the lookup.
      - run: npm run e2e
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: e2e/artifacts
